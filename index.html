<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>ENEE UTCD - PQR</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <script src="config.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6f9;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 430px;
    }

    .login-card {
      background: white;
      border-radius: 22px;
      padding: 32px 28px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, .12);
    }

    .logo-container {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-container img {
      width: 150px;
      max-width: 70%;
      height: auto;
      object-fit: contain;
    }

    .app-title {
      text-align: center;
      margin: 8px 0 4px;
      font-size: 25px;
      font-weight: 800;
      color: #17365d;
    }

    .app-subtitle {
      text-align: center;
      color: #687686;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #34495e;
      margin-bottom: 7px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #75869a;
    }

    .input-wrapper input {
      width: 100%;
      height: 50px;
      border: 1px solid #d5dde5;
      border-radius: 12px;
      padding: 0 45px;
      font-size: 16px;
      outline: none;
      transition: .2s;
    }

    .input-wrapper input:focus {
      border-color: #2367a8;
      box-shadow: 0 0 0 3px rgba(35, 103, 168, .10);
    }

    .password-toggle {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: none;
      color: #75869a;
      cursor: pointer;
      padding: 5px;
    }

    .btn-login {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 13px;
      background: #17365d;
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
      transition: .2s;
    }

    .btn-login:hover {
      opacity: .92;
    }

    .btn-login:disabled {
      opacity: .6;
      cursor: wait;
    }

    .error-message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      background: #fff1f1;
      color: #b42318;
      font-size: 14px;
      text-align: center;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 11px;
      color: #8b98a6;
    }

    @media (max-width: 480px) {

      body {
        padding: 12px;
      }

      .login-card {
        padding: 27px 20px;
        border-radius: 18px;
      }

      .app-title {
        font-size: 22px;
      }

    }

  </style>
</head>

<body>

  <main class="login-container">

    <section class="login-card">

      <div class="logo-container">

        <!--
          Colocar aquí el archivo del logo que
          subiremos al repositorio.
        -->

        <img
          src="UTCD Vertical.png"
          alt="ENEE UTCD"
        >

      </div>

      <h1 class="app-title">
        GESTIÓN DE PQR
      </h1>

      <div class="app-subtitle">
        ENEE · Unidad Técnica de Control y Distribución
      </div>


      <form id="loginForm">

        <div class="form-group">

          <label for="usuario">
            Usuario
          </label>

          <div class="input-wrapper">

            <i class="fa-solid fa-user"></i>

            <input
              id="usuario"
              type="text"
              autocomplete="username"
              placeholder="Ingrese su usuario"
              required
            >

          </div>

        </div>


        <div class="form-group">

          <label for="password">
            Contraseña
          </label>

          <div class="input-wrapper">

            <i class="fa-solid fa-lock"></i>

            <input
              id="password"
              type="password"
              autocomplete="current-password"
              placeholder="Ingrese su contraseña"
              required
            >

            <button
              type="button"
              class="password-toggle"
              onclick="togglePassword()"
            >
              <i
                id="passwordIcon"
                class="fa-solid fa-eye"
              ></i>
            </button>

          </div>

        </div>


        <button
          type="submit"
          class="btn-login"
          id="btnLogin"
        >
          <i class="fa-solid fa-right-to-bracket"></i>
          &nbsp; Iniciar sesión
        </button>

      </form>


      <div
        id="errorMessage"
        class="error-message"
      ></div>


      <div class="footer">
        ENEE · UTCD<br>
        Sistema interno de gestión de PQR
      </div>

    </section>

  </main>


<script>

document.addEventListener("DOMContentLoaded", function() {

  // Si ya existe sesión, ir directamente al menú.
  const usuario = sessionStorage.getItem("usuario");

  if (usuario) {
    window.location.href = "menu.html";
    return;
  }

  document
    .getElementById("loginForm")
    .addEventListener("submit", iniciarSesion);

});


function togglePassword() {

  const password =
    document.getElementById("password");

  const icon =
    document.getElementById("passwordIcon");

  if (password.type === "password") {

    password.type = "text";

    icon.classList.remove("fa-eye");
    icon.classList.add("fa-eye-slash");

  } else {

    password.type = "password";

    icon.classList.remove("fa-eye-slash");
    icon.classList.add("fa-eye");

  }

}


async function iniciarSesion(event) {

  event.preventDefault();

  const usuario =
    document
      .getElementById("usuario")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value
      .trim();

  const btn =
    document.getElementById("btnLogin");

  const error =
    document.getElementById("errorMessage");


  error.style.display = "none";
  error.textContent = "";


  if (!usuario || !password) {

    mostrarError(
      "Debe ingresar usuario y contraseña."
    );

    return;
  }


  btn.disabled = true;

  btn.innerHTML =
    '<i class="fa-solid fa-spinner fa-spin"></i> Ingresando...';


  try {

    const response = await fetch(
      CONFIG.URL_APPS_SCRIPT,
      {
        method: "POST",
        mode: "cors",
        body: JSON.stringify({
          action: "login",
          user: usuario,
          pass: password
        })
      }
    );


    const data = await response.json();


    if (data.status !== "Éxito") {

      throw new Error(
        data.message ||
        "Usuario o contraseña incorrectos."
      );

    }


    // ==================================================
    // SESIÓN
    // ==================================================

    sessionStorage.setItem(
      "usuario",
      data.usuario || usuario
    );

    sessionStorage.setItem(
      "tipo_usuario",
      data.id_tipous || ""
    );

    sessionStorage.setItem(
      "tipo_usuario_nombre",
      data.tipo_usuario || ""
    );

    sessionStorage.setItem(
      "sector",
      data.sector || ""
    );


    // Limpieza de datos de sesión anteriores.
    sessionStorage.removeItem("item_pqr");


    window.location.href = "menu.html";


  } catch (error) {

    console.error(error);

    mostrarError(
      error.message ||
      "No fue posible iniciar sesión."
    );


    btn.disabled = false;

    btn.innerHTML =
      '<i class="fa-solid fa-right-to-bracket"></i> &nbsp; Iniciar sesión';

  }

}


function mostrarError(mensaje) {

  const error =
    document.getElementById("errorMessage");

  error.textContent = mensaje;
  error.style.display = "block";

}

</script>

</body>
</html>
